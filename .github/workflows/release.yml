name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: consortium-linux-amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            name: consortium-linux-arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            name: consortium-darwin-amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            name: consortium-darwin-arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            name: consortium-windows-amd64
            archive: zip
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Read Bun version
        run: echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit release source
        run: scripts/audit-release.sh

      - name: Build frontend assets
        run: |
          bun install --frozen-lockfile
          NODE_ENV=production bun run build
          scripts/precompress.sh frontend/dist
          rm -rf pkg/static/dist
          mkdir -p pkg/static/dist
          cp -R frontend/dist/. pkg/static/dist/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.name }}
          go build -tags release -ldflags="-s -w" -o dist/${{ matrix.name }}/consortium${{ matrix.ext }} ./cmd/server
          cp README.md LICENSE NOTICE SECURITY.md dist/${{ matrix.name }}/

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        run: |
          tar -C dist -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Package zip
        if: matrix.archive == 'zip'
        run: |
          (cd dist && zip -r ../${{ matrix.name }}.zip ${{ matrix.name }})
          sha256sum ${{ matrix.name }}.zip > ${{ matrix.name }}.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.${{ matrix.archive }}
            ${{ matrix.name }}.${{ matrix.archive }}.sha256
          generate_release_notes: true
