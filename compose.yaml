services:
  consortium:
    build:
      context: .
    image: consortium:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      EMBED_FRONTEND: "true"
      BIND_ADDR: 0.0.0.0:8080
      DB_PATH: /data/consortium.db
    volumes:
      - consortium-data:/data

volumes:
  consortium-data:
